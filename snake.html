  <style>
    /* 640 to match languages.html, the other narrow page, rather than the 520
       this used to be. The footer nav is shared furniture and does not know
       what page it is on: seven items need about 500px, and 520 minus 2rem of
       padding each side left 448, so SNAKE alone dropped to a second line here
       and nowhere else. Measured by rendering the nav at 448/528/568/628 --
       448 wraps, 528 fits by a hair, 568 fits with room.

       The board does not grow with it. The canvas is width:100%, so the column
       width WAS the board size; .board-frame is capped at the 448 it has
       always drawn at so the game looks exactly as it did. Widening the column
       was to fix the footer, not to resize the game. */
    .wrap { max-width: 640px; margin: 0 auto; padding: 0 2rem 3rem; }

    header {
      padding: 2rem 0 2.4rem;
      opacity: 0; animation: rise .8s ease forwards .1s;
    }
    h1 { font-size: clamp(1.6rem, 4vw, 2.2rem); font-weight: 400; line-height: 1.15; }
    h1 em { font-style: italic; color: var(--accent); }

    .board-section {
      opacity: 0; animation: rise .9s ease forwards .3s;
    }
    .board-frame {
      max-width: 448px;
      margin: 0 auto;
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 14px;
      background: #faf8f4;
    }
    canvas {
      display: block;
      width: 100%;
      background: var(--bg);
      image-rendering: pixelated;
      border-radius: 2px;
    }
    .hud {
      display: flex; justify-content: space-between;
      font-family: var(--font-ui); font-size: var(--fs-3xs); letter-spacing: .1em;
      text-transform: uppercase; color: var(--muted); margin-top: 12px;
    }
    /* "Score" and "Best" are words and take the sans with the rest of the HUD;
       the two numbers beside them are the only thing on this page that changes
       while you look at it. In a proportional face a 1 is narrower than a 4,
       so the digits shuffle sideways on every apple. Mono with tabular figures
       holds them still. */
    .hud span.accent {
      color: var(--accent);
      font-family: var(--font-mono);
      font-variant-numeric: tabular-nums;
    }

    .msg {
      text-align: center;
      font-size: var(--fs-base);
      font-style: italic;
      color: var(--muted);
      margin-top: 1.4rem;
      min-height: 1.4rem;
    }

    .pad {
      margin-top: 1.8rem;
      display: grid;
      grid-template-columns: repeat(3, 52px);
      grid-template-rows: repeat(2, 44px);
      gap: 8px;
      justify-content: center;
    }
    .pad button {
      background: transparent;
      border: 1px solid var(--line-strong);
      border-radius: 999px;
      color: var(--ink);
      font-family: var(--font-ui);
      font-size: var(--fs-sm);
      cursor: pointer;
      transition: color .2s, border-color .2s;
    }
    .pad button:hover { color: var(--accent); border-color: var(--accent); }
    .pad button:active { transform: translateY(1px); }
    #up { grid-column: 2; grid-row: 1; }
    #left { grid-column: 1; grid-row: 2; }
    #down { grid-column: 2; grid-row: 2; }
    #right { grid-column: 3; grid-row: 2; }

    .hint {
      text-align: center;
      font-family: var(--font-ui);
      font-size: var(--fs-4xs);
      letter-spacing: .08em;
      color: var(--muted);
      margin-top: 1.4rem;
      opacity: .8;
    }

    footer { padding:3rem 0 0; }
    footer p {
      font-family: var(--font-ui); font-size: var(--fs-3xs);
      letter-spacing: .1em; color: var(--muted);
    }

<body>
<div class="wrap">
  <a href="index.html" class="back">← Back</a>
  <main>

  <noscript>
    <p class="noscript-note">The game runs in the browser, so with JavaScript turned off the board below stays empty.</p>
  </noscript>
  <header>
    <p class="eyebrow">A small diversion</p>
    <h1>Snake, for <em>old time's sake</em></h1>
  </header>

  <section class="board-section">
    <div class="board-frame">
      <!-- A canvas with no label announces itself as the word "canvas" and
           nothing else. The game is unavoidably visual, so this does not make
           it playable without sight; it makes it identifiable, which is the
           difference between "there is a game here I cannot play" and an
           unexplained blank. Score and best are real text in .hud below, and
           #msg is a live region so "Game over" is actually spoken. -->
      <canvas id="game" width="220" height="220"
              aria-label="Snake game board"></canvas>
      <div class="hud">
        <span>Score: <span id="score" class="accent">0</span></span>
        <span>Best: <span id="best" class="accent">0</span></span>
      </div>
    </div>
    <p class="msg" id="msg" role="status" aria-live="polite">Press an arrow key or tap a button to start</p>
    <div class="pad">
      <button id="up" aria-label="Up">↑</button>
      <button id="left" aria-label="Left">←</button>
      <button id="down" aria-label="Down">↓</button>
      <button id="right" aria-label="Right">→</button>
    </div>
    <p class="hint">Arrow keys / WASD to play · Space to pause</p>
  </section>

  </main>

</div>

<script>
(function () {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const cell = 10;
  const cols = canvas.width / cell;
  const rows = canvas.height / cell;

  const ink = '#1a1814';
  const accent = '#9a2a2a';
  const bg = '#f5f2ed';

  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const msgEl = document.getElementById('msg');

  let best = SnakeLogic.readBest();
  bestEl.textContent = best;

  let snake, dir, nextDir, food, score, running, paused, speed, timer;

  function reset() {
    snake = [
      { x: 6, y: 11 },
      { x: 5, y: 11 },
      { x: 4, y: 11 }
    ];
    dir = { x: 1, y: 0 };
    nextDir = dir;
    score = 0;
    speed = 140;
    running = false;
    paused = false;
    placeFood();
    scoreEl.textContent = '0';
    msgEl.textContent = 'Press an arrow key or tap a button to start';
    draw();
  }

  function placeFood() {
    while (true) {
      const f = { x: Math.floor(Math.random() * cols), y: Math.floor(Math.random() * rows) };
      if (!snake.some(s => s.x === f.x && s.y === f.y)) {
        food = f;
        return;
      }
    }
  }

  function start() {
    if (running) return;
    running = true;
    paused = false;
    msgEl.textContent = '';
    loop();
  }

  function loop() {
    clearTimeout(timer);
    if (!running || paused) return;
    step();
    draw();
    timer = setTimeout(loop, speed);
  }

  function step() {
    dir = nextDir;
    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
    const willGrow = head.x === food.x && head.y === food.y;

    if (head.x < 0 || head.x >= cols || head.y < 0 || head.y >= rows || SnakeLogic.selfCollides(snake, head, willGrow)) {
      return gameOver();
    }

    snake.unshift(head);

    if (head.x === food.x && head.y === food.y) {
      score += 10;
      scoreEl.textContent = score;
      if (speed > 70) speed -= 3;
      placeFood();
    } else {
      snake.pop();
    }
  }

  function gameOver() {
    running = false;
    clearTimeout(timer);
    if (score > best) {
      best = score;
      SnakeLogic.writeBest(best);
      bestEl.textContent = best;
      msgEl.textContent = 'New best — press a key to retry';
    } else {
      msgEl.textContent = 'Game over — press a key to retry';
    }
  }

  function draw() {
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = ink;
    snake.forEach(s => {
      ctx.fillRect(s.x * cell + 1, s.y * cell + 1, cell - 2, cell - 2);
    });

    ctx.fillStyle = accent;
    ctx.fillRect(food.x * cell + 2, food.y * cell + 2, cell - 4, cell - 4);
  }

  function setDir(nx, ny) {
    if (!SnakeLogic.canTurn(nextDir, {x: nx, y: ny})) return;
    nextDir = { x: nx, y: ny };
    if (!running) {
      if (score > 0 || snake.length !== 3) reset();
      start();
    } else if (paused) {
      paused = false;
      loop();
    }
  }

  window.addEventListener('keydown', e => {
    switch (e.key) {
      case 'ArrowUp': case 'w': case 'W': setDir(0, -1); e.preventDefault(); break;
      case 'ArrowDown': case 's': case 'S': setDir(0, 1); e.preventDefault(); break;
      case 'ArrowLeft': case 'a': case 'A': setDir(-1, 0); e.preventDefault(); break;
      case 'ArrowRight': case 'd': case 'D': setDir(1, 0); e.preventDefault(); break;
      case ' ':
        if (running) {
          paused = !paused;
          msgEl.textContent = paused ? 'Paused' : '';
          if (!paused) loop();
        } else {
          reset();
          start();
        }
        e.preventDefault();
        break;
    }
  });

  document.getElementById('up').addEventListener('click', () => setDir(0, -1));
  document.getElementById('down').addEventListener('click', () => setDir(0, 1));
  document.getElementById('left').addEventListener('click', () => setDir(-1, 0));
  document.getElementById('right').addEventListener('click', () => setDir(1, 0));

  reset();
})();
</script>
</body>
