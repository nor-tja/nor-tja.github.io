  <style>
    body { display:flex; align-items:center; justify-content:center; position:relative; overflow:hidden; }

    /* ── coffee cup ── */
    .coffee-scene {
      position: fixed;
      bottom: clamp(24px, 5vw, 56px);
      right: clamp(18px, 4vw, 44px);
      width: clamp(130px, 15vw, 210px);
      height: clamp(130px, 15vw, 210px);
      opacity: 0;
      animation: fadeStain 2s ease forwards 1.2s;
      cursor: pointer;
      z-index: 10;
    }
    .coffee-scene:hover .cup-link-text {
      opacity: 1;
    }
    .coffee-mug-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: brightness(1.05) contrast(0.95) saturate(0.85);
      mix-blend-mode: darken;
      opacity: 0.9;
    }
    .cup-link-text {
      position: absolute;
      top: 43%;
      left: 41%;
      transform: translate(-50%, -50%);
      white-space: nowrap;
      text-align: center;
      font-family: 'DM Mono', monospace;
      font-size: var(--fs-4xs);
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--accent);
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
      font-weight: 400;
    }
    @keyframes fadeStain {
      to { opacity: 1; }
    }

    .center {
      max-width: 520px;
      padding: 2rem;
      position: relative;
      z-index: 1;
    }
    .greeting {
      font-size: clamp(1.3rem, 3.8vw, 1.8rem);
      line-height: 1.55;
      margin-bottom: 2.4rem;
      opacity: 0;
      animation: rise 0.9s ease forwards 0.15s;
    }
    .greeting em { font-style: italic; color: var(--accent); }
    .links {
      display: flex;
      flex-direction: column;
      gap: 0.9rem;
      opacity: 0;
      animation: rise 0.9s ease forwards 0.4s;
    }
    .links a {
      font-family: 'DM Mono', monospace;
      font-size: var(--fs-2xs);
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 0.7rem;
      transition: color 0.2s;
    }
    .links a::before {
      content: '';
      display: block;
      width: 24px;
      height: 1px;
      background: var(--line);
      transition: width 0.25s, background 0.2s;
      flex-shrink: 0;
    }
    .links a:hover { color: var(--accent); }
    .links a:hover::before { width: 40px; background: var(--accent); }


    @media (max-width: 480px) {
      .coffee-scene {
        width: clamp(110px, 30vw, 150px);
        height: clamp(110px, 30vw, 150px);
        bottom: 18px;
        right: 14px;
      }
    }
  </style>

  <!-- Coffee cup scene -->
  <a href="coffee.html" class="coffee-scene">
    <img src="coffee_mug.png" alt="Coffee mug" class="coffee-mug-img">
    <span class="cup-link-text">Coffee notes</span>
  </a>

  <div class="center">
    <p class="greeting">
      Hello, I am <em>Katja</em>. I am a data scientist who enjoys building
      and organising things. Here are links to my CV, resources I appreciate, a coffee guide,
      a pomodoro timer and a daily language practice page.
    </p>

      <a href="languages.html">Practise a language</a>
      <a href="snake.html">Play snake</a>
    </nav>
  </div>
</body>
