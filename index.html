  <!-- Self-hosted; see tools/fetch-fonts.js. Preloading the faces THIS page
       renders immediately skips the stylesheet->font discovery hop.
       crossorigin is required even same-origin: fonts always fetch in CORS
       mode, and without it the preload is discarded and fetched twice.
       Only faces the page can reach belong here -- a preload nothing uses
       spends a connection on a file the browser throws away. Checked by
       tests/typography.test.js. -->
  <link rel="preload" as="font" type="font/woff2" crossorigin href="assets/fonts/eb-garamond-normal-400-latin.woff2">
  <link rel="stylesheet" href="assets/css/fonts.css">
  <link rel="stylesheet" href="assets/css/site.css">
  <style>
    /* `overflow:hidden` here used to be safe only by luck: the content was
       always shorter than the viewport. A greeting plus six links still
       overflows a phone in landscape (~370px of usable height), and hidden
       overflow on a centred flex child clips BOTH ends with no way to scroll
       to either. `safe center` falls back to flex-start once the child no
       longer fits, so the top stays reachable. */
    body {
      display: flex;
      /* Declared twice on purpose. A browser without `safe` alignment drops
         the second line as invalid and keeps plain `center`, rather than
         dropping both and falling back to `stretch`. */
      align-items: center;
      align-items: safe center;
      justify-content: center;
      position: relative;
      overflow-x: hidden;
      overflow-y: auto;
    }

    /* ── coffee cup ── */
    .coffee-scene {
      position: fixed;
      bottom: clamp(24px, 5vw, 56px);
      right: clamp(18px, 4vw, 44px);
      width: clamp(130px, 15vw, 210px);
      height: clamp(130px, 15vw, 210px);
      opacity: 0;
      animation: fadeStain 2s ease forwards 1.2s;
      cursor: pointer;
      z-index: 10;
    }
    .coffee-scene:hover .cup-link-text {
      opacity: 1;
    }
    .coffee-mug-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: brightness(1.05) contrast(0.95) saturate(0.85);
      mix-blend-mode: darken;
      opacity: 0.9;
    }
    .cup-link-text {
      position: absolute;
      top: 43%;
      left: 41%;
      transform: translate(-50%, -50%);
      white-space: nowrap;
      text-align: center;
      font-family: var(--font-ui);
      font-size: var(--fs-4xs);
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--accent);
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
      font-weight: 400;
    }
    @keyframes fadeStain {
      to { opacity: 1; }
    }

    .center {
      max-width: 520px;
      padding: 2rem;
      position: relative;
      z-index: 1;
    }
    .greeting {
      font-size: clamp(1.3rem, 3.8vw, 1.8rem);
      line-height: 1.55;
      margin-bottom: 2.4rem;
      opacity: 0;
      animation: rise 0.9s ease forwards 0.15s;
    }
    .greeting em { font-style: italic; color: var(--accent); }
    /* The gap is 0.8rem rather than the 1.5rem it looks like it should be:
       each link carries 0.35rem of its own vertical padding for the tap
       target, so the measured space between two labels is 0.8 + 0.35 + 0.35
       = 1.5rem. Raising the gap without subtracting the padding would space
       them half again as far apart as intended. */
    .links {
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
      opacity: 0;
      animation: rise 0.9s ease forwards 0.4s;
    }
    .links a {
      display: flex;
      align-items: center;
      gap: 0.7rem;
      /* WCAG 2.5.8 wants 24px. The label alone is a ~13px line box, so this
         padding is what makes the row tappable: 13 + 2 x 5.6 = 24.2px. */
      padding: 0.35rem 0;
      font-family: var(--font-ui);
      font-size: var(--fs-2xs);
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
      text-decoration: none;
      transition: color 0.2s;
    }
    /* flex-shrink:0 because the rule is a flex item now. Without it a long
       label squeezes the 24px rule down and the left edge stops lining up. */
    .links a::before {
      content: '';
      flex: 0 0 auto;
      width: 24px;
      height: 1px;
      background: var(--line);
      transition: width 0.25s, background 0.2s;
    }
    .links a:hover { color: var(--accent); }
    .links a:hover::before { width: 40px; background: var(--accent); }


    @media (max-width: 480px) {
      .coffee-scene {
        width: clamp(110px, 30vw, 150px);
        height: clamp(110px, 30vw, 150px);
        bottom: 18px;
        right: 14px;
      }
    }
  </style>
</head>
<body>

  <!-- Coffee cup scene -->
  <a href="coffee.html" class="coffee-scene">
    <img src="coffee_mug.png" alt="Coffee mug" class="coffee-mug-img">
    <span class="cup-link-text">Coffee notes</span>
  </a>

  <div class="center">
    <p class="greeting">
      Hello, I am <em>Katja</em> — a data scientist who enjoys building and
      organising things. These are the small tools I made and kept using.
    </p>
    <!-- The name carries the description. "Resources" and "Pomodoro" are
         labels for someone who already knows what is behind them; "Reading &
         watching" and "Pomodoro hourglass" tell a stranger. Kept short enough
         to stay on one line as tracked-out uppercase -- a name that wraps is
         a subtitle wearing a disguise. -->
    <nav class="links">
      <a href="cv.html">CV</a>
      <a href="resources.html">Reading &amp; watching</a>
      <a href="coffee.html">Coffee notes</a>
      <a href="pomodoro.html">Pomodoro hourglass</a>
      <a href="languages.html">Language practice</a>
      <a href="snake.html">Snake</a>
    </nav>
  </div>
</body>
</html>
